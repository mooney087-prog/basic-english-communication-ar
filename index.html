<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#063b2b">
  <title>Udon Thani Expo English AR Game</title>
  <style>
    :root{--green:#075c43;--green2:#0b7d59;--gold:#ffd86b;--cream:#fffaf0;--ink:#153b31;--red:#bb3d3d;--ok:#08734c}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;min-height:100%;margin:0;font-family:"Noto Sans Thai",Tahoma,Arial,sans-serif;background:#042a20;color:#fff}button{font:inherit;touch-action:manipulation;cursor:pointer}
    #camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1)}#shade{position:fixed;inset:0;display:none;background:linear-gradient(rgba(1,25,18,.15),rgba(1,25,18,.82));pointer-events:none}
    #app{position:relative;z-index:2;width:100%;min-height:100dvh;display:flex;justify-content:center}.screen{width:min(100%,920px);min-height:100dvh;display:none;padding:clamp(13px,3vw,28px);padding-top:max(13px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}.screen.active{display:flex;flex-direction:column}
    .cover{width:100%;min-height:100dvh;display:grid;place-items:end center;background:url("images/cover.webp") center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(1,27,19,.94) 100%)}.cover-panel{position:relative;z-index:1;width:min(94%,720px);margin-bottom:max(22px,env(safe-area-inset-bottom));padding:18px;text-align:center;border:1px solid #ffd86bb3;border-radius:24px;background:#043023df;box-shadow:0 16px 50px #0006;backdrop-filter:blur(8px)}.cover-panel h1{margin:0;color:var(--gold);font-size:clamp(21px,5.2vw,38px);line-height:1.17}.cover-panel p{margin:9px 0 16px;font-size:clamp(14px,3.4vw,18px);line-height:1.45}
    .primary,.secondary{border:0;border-radius:15px;min-height:50px;font-weight:900;padding:11px 20px}.primary{color:#12362c;background:linear-gradient(135deg,#ffe99f,var(--gold));box-shadow:0 7px 18px #ffc53b3d}.secondary{color:#fff;background:#ffffff20;border:1px solid #ffffff55}.primary:disabled,.secondary:disabled{opacity:.4;cursor:not-allowed}
    .topbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:10px}.topic{font-size:clamp(17px,4vw,25px);font-weight:1000;color:var(--gold)}.phase{font-size:13px;color:#d9fff0;margin-top:2px}.score{white-space:nowrap;padding:8px 12px;border-radius:999px;color:var(--gold);font-weight:900;background:#0004;border:1px solid #ffd86b73}.progress{height:8px;background:#ffffff2e;border-radius:999px;overflow:hidden;margin-bottom:13px}.progress div{height:100%;background:linear-gradient(90deg,#65efb6,var(--gold));transition:width .35s}
    .card{width:100%;background:#fffaf0f7;color:var(--ink);border:2px solid #ffd86bcc;border-radius:23px;overflow:hidden;box-shadow:0 18px 45px #0004}.scene{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddeae4}.body{padding:clamp(14px,3.5vw,23px);text-align:center}.word{margin:0;color:var(--green);font-size:clamp(36px,10vw,68px);line-height:1.05;overflow-wrap:anywhere}.reading{margin:8px 0 2px;color:#8c5c00;font-size:clamp(17px,4.2vw,24px);font-weight:900}.meaning{margin:0 0 14px;font-size:clamp(17px,4vw,23px)}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.green-btn{background:#087a58}.light-btn{color:#315a4d;background:#eef6f2;border-color:#aac9bd}.status{min-height:47px;margin:12px auto 0;padding:9px 11px;width:min(100%,620px);border-radius:13px;background:#e9f7f1;line-height:1.45}.status.ok{background:#d8f7e9;color:var(--ok);font-weight:900}.status.bad{background:#ffe3df;color:var(--red);font-weight:900}.fallback{margin-top:8px;font-size:13px}.footer{margin-top:auto;padding-top:13px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
    .thai{margin:0 0 9px;padding:10px 12px;border-radius:13px;background:#eff8f4;font-size:clamp(14px,3.5vw,18px);line-height:1.45}.answer{min-height:61px;margin:10px 0 12px;padding:11px;display:flex;flex-wrap:wrap;gap:7px;align-content:center;justify-content:center;border:2px dashed #8ab8a5;border-radius:15px;background:white;font-size:clamp(16px,3.8vw,22px);font-weight:900}.placeholder{color:#82948c;font-weight:500}.tokens{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-content:flex-start;min-height:132px;padding:9px 0}.token{border:1px solid #f0c74d;border-radius:13px;padding:10px 14px;min-height:45px;color:#173b31;background:linear-gradient(#fffef8,#fff1bd);font-weight:900;box-shadow:0 5px 12px #21473a26;animation:float var(--d,5s) ease-in-out infinite alternate}.token.used{opacity:0;pointer-events:none;transform:scale(.6)}.token.wrong{animation:shake .3s;background:#ffd8d4;border-color:#d84f4f}@keyframes float{from{transform:translateY(-6px)}to{transform:translateY(7px)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
    .complete{justify-content:center;text-align:center;background:linear-gradient(160deg,#063b2b,#0b7756)}.complete-card{margin:auto;width:min(100%,650px);padding:26px 20px;border-radius:28px;background:#fffaf0f7;color:var(--ink);border:2px solid var(--gold)}.trophy{font-size:64px}.final-score{font-size:clamp(42px,12vw,78px);color:var(--green);font-weight:1000}.ar-controls{position:fixed;z-index:5;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}.ar-control{padding:9px 12px;border:1px solid #ffffff59;border-radius:999px;color:#fff;background:#032d21d9;font-size:13px;text-decoration:none}
    @media(min-width:700px){.learning{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(310px,.92fr)}.learning .scene{height:100%;aspect-ratio:auto;min-height:440px}.learning .body{display:flex;flex-direction:column;justify-content:center}.sentence .scene{max-height:38dvh}.tokens{min-height:150px}}
    @media(max-height:650px) and (orientation:landscape){.screen{padding:8px 14px}.scene{max-height:42dvh}.body{padding:10px}.word{font-size:35px}.status{min-height:37px;margin-top:6px;padding:6px 9px}}@media(prefers-reduced-motion:reduce){.token{animation:none}}
  </style>
</head>
<body>
  <video id="camera" autoplay muted playsinline></video><div id="shade"></div>
  <div id="app">
    <section id="cover" class="screen active" style="padding:0;max-width:none"><div class="cover"><div class="cover-panel"><h1>Basic English Communication</h1><p>เตรียมความพร้อมมัคคุเทศก์เยาวชน<br>สู่งานมหกรรมพืชสวนโลกอุดรธานี 2569</p><button class="primary" id="start">เริ่มเกม</button></div></div></section>
    <section id="vocab" class="screen">
      <div class="topbar"><div><div class="topic" id="vTopic"></div><div class="phase">ขั้นที่ 1 ฝึกคลังคำศัพท์</div></div><div class="score" id="vScore"></div></div><div class="progress"><div id="vProg"></div></div>
      <article class="card learning"><img id="vImg" class="scene" alt="ภาพประกอบคำศัพท์"><div class="body"><h2 class="word" id="vWord"></h2><p class="reading" id="vRead"></p><p class="meaning" id="vMean"></p><div class="actions"><button class="primary" id="listen">🔊 ฟังคำศัพท์</button><button class="secondary green-btn" id="speak">🎤 พูดตาม</button></div><div class="status" id="speechStatus">กด “ฟังคำศัพท์” แล้วกด “พูดตาม”</div></div></article>
      <div class="footer"><button class="secondary" id="prevWord">← ย้อนกลับไปฝึก</button><button class="primary" id="nextWord" disabled>คำต่อไป →</button></div>
    </section>
    <section id="sentence" class="screen">
      <div class="topbar"><div><div class="topic" id="sTopic"></div><div class="phase">ขั้นที่ 2 แตะเรียงประโยค</div></div><div class="score" id="sScore"></div></div><div class="progress"><div id="sProg"></div></div>
      <article class="card sentence"><img id="sImg" class="scene" alt="ภาพประกอบประโยค"><div class="body"><p class="thai" id="thai"></p><p class="reading" id="sRead"></p><div class="answer" id="answer"><span class="placeholder">แตะคำตามลำดับที่ถูกต้อง</span></div><div class="tokens" id="tokens"></div><div class="status" id="sentenceStatus">เรียงคำให้ถูกต้อง แล้วจึงฝึกพูดทั้งประโยค</div><div class="actions"><button class="secondary light-btn" id="hint">💡 คำใบ้</button><button class="secondary light-btn" id="reset">↻ เรียงใหม่</button><button class="secondary light-btn" id="listenSentence" disabled>🔊 ฟังประโยคซ้ำ</button><button class="secondary green-btn" id="speakSentence" disabled>🗣️ เริ่มพูดตาม</button></div></div></article>
      <div class="footer"><button class="secondary" id="prevSentence">← ย้อนกลับไปฝึก</button><button class="primary" id="nextSentence" disabled>ประโยคถัดไป →</button></div>
    </section>
    <section id="complete" class="screen complete"><div class="complete-card"><div class="trophy">🏆</div><h1>ยอดเยี่ยม!</h1><p>คุณฝึกครบทั้ง 3 หัวข้อแล้ว</p><div class="final-score" id="finalScore"></div><p id="finalText"></p><button class="primary" id="again">เล่นอีกครั้ง</button></div></section>
  </div>
  <div class="ar-controls"><button id="ar" class="ar-control">📷 เปิดกล้องหน้า</button></div>
  <script>
  const topics=[
   {title:"ตอนที่ 1 การทักทายและแนะนำตัว",v:[
    ["welcome","เวลคัม","ยินดีต้อนรับ","expo-overview"],["Expo","เอ็กซ์โป","งานมหกรรม","cover"],["volunteer","วอลันเทียร์","อาสาสมัคร","cover"],["guide","ไกด์","มัคคุเทศก์","cover"],["care","แคร์","ดูแล","cover"]],s:[
    ["Welcome to the Expo in Udon Thani.","ยินดีต้อนรับสู่งานมหกรรมพืชสวนโลก ณ จังหวัดอุดรธานี","expo-overview"],["My name is Malee.","ดิฉันชื่อมาลี","cover"],["I am a volunteer guide and I will take care of you today.","ดิฉันเป็นมัคคุเทศก์อาสา และจะดูแลท่านในวันนี้","cover"]]},
   {title:"ตอนที่ 2 การให้ข้อมูลพื้นฐาน",v:[
    ["wetland","เว็ตแลนด์","พื้นที่ชุ่มน้ำ","wetland-garden"],["diversity","ไดเวอร์ซิตี","ความหลากหลาย","biodiversity"],["international garden","อินเทอร์แนชเชินนัล การ์เดน","สวนนานาชาติ","international-garden"],["greenhouse","กรีนเฮาส์","เรือนกระจก","greenhouse"],["innovation","อินโนเวชัน","นวัตกรรม","agricultural-innovation"]],s:[
    ["Nong Dae Wetland, Kut Sa Subdistrict, Mueang Udon Thani District.","พื้นที่ชุ่มน้ำหนองแด ตำบลกุดสระ อำเภอเมืองอุดรธานี จังหวัดอุดรธานี","wetland-garden"],["Highlight: Diversity of life, wetland gardens, international gardens, greenhouses, and agricultural innovation.","จุดเด่น ได้แก่ ความหลากหลายของสิ่งมีชีวิต สวนพื้นที่ชุ่มน้ำ สวนนานาชาติ เรือนกระจก และนวัตกรรมทางการเกษตร","biodiversity"],["It is scheduled from 1 November 2026 to 14 March 2027.","งานมีกำหนดจัดขึ้นตั้งแต่วันที่ 1 พฤศจิกายน 2569 ถึงวันที่ 14 มีนาคม 2570","expo-overview"]]},
   {title:"ตอนที่ 3 การถามและตอบคำถาม",v:[
    ["information","อินฟอร์เมชัน","ข้อมูล","expo-overview"],["known","โนน","เป็นที่รู้จัก","international-garden"],["apologize","อะพอโลไจซ์","ขออภัย","cover"],["moment","โมเมนต์","สักครู่","cover"],["check","เช็ก","ตรวจสอบ","agricultural-innovation"]],s:[
    ["Would you like more information about the Expo?","ท่านต้องการข้อมูลเพิ่มเติมเกี่ยวกับงานมหกรรมหรือไม่","expo-overview"],["The Expo is known for diversity of life, wetland gardens, international gardens, greenhouses, and agricultural innovation.","งานมหกรรมแห่งนี้มีชื่อเสียงด้านความหลากหลายของสิ่งมีชีวิต สวนพื้นที่ชุ่มน้ำ สวนนานาชาติ เรือนกระจก และนวัตกรรมทางการเกษตร","international-garden"],["I apologize. Please give me a moment to check the information for you.","ขออภัย กรุณารอสักครู่ ดิฉันจะตรวจสอบข้อมูลให้ท่าน","cover"]]}
  ];
  const sentenceSpeech=[
   [
    {tts:"Welcome to the Expo in Udon Thani.",read:"เวลคัม ทู ดิ เอ็กซ์โป อิน อุดรธานี",keys:[["welcome"],["expo"],["udon"],["thani"]]},
    {tts:"My name is Malee.",read:"มาย เนม อิซ มาลี",keys:[["name"],["malee","mali"]]},
    {tts:"I am a volunteer guide, and I will take care of you today.",read:"ไอ แอม อะ วอลันเทียร์ ไกด์ แอนด์ ไอ วิล เทก แคร์ ออฟ ยู ทูเดย์",keys:[["volunteer"],["guide"],["care"],["today"]]}
   ],
   [
    {tts:"Nong Day Wetland, Koot Sa Subdistrict, Muang Udon Thani District.",read:"นอง แด เว็ตแลนด์, คูต-ซา ซับดิสทริกต์ (ตำบลกุดสระ), เมือง อุดรธานี ดิสทริกต์ (อำเภอเมืองอุดรธานี)",keys:[["nong"],["dae","day"],["wetland"],["kut","koot","could","good"],["sa","sah"],["subdistrict","sub district"],["mueang","muang"],["udon"],["thani"],["district"]]},
    {tts:"Highlight: Diversity of life, wetland gardens, international gardens, greenhouses, and agricultural innovation.",read:"ไฮไลต์: ไดเวอร์ซิตี ออฟ ไลฟ์, เว็ตแลนด์ การ์เดนส์, อินเทอร์แนชเชินนัล การ์เดนส์, กรีนเฮาส์ซิส, แอนด์ แอกริคัลเชอรัล อินโนเวชัน",keys:[["diversity"],["life"],["wetland"],["international"],["greenhouse","greenhouses"],["agricultural"],["innovation"]]},
    {tts:"It is scheduled from the first of November, twenty twenty-six, to the fourteenth of March, twenty twenty-seven.",read:"อิท อิซ สเคจูลด์ ฟรอม เดอะ เฟิร์สต์ ออฟ โนเวมเบอร์ ทเวนตี ทเวนตี-ซิกซ์ ทู เดอะ โฟร์ทีนธ์ ออฟ มาร์ช ทเวนตี ทเวนตี-เซเวน",keys:[["scheduled"],["november"],["2026","twenty twenty six"],["march"],["2027","twenty twenty seven"]]}
   ],
   [
    {tts:"Would you like more information about the Expo?",read:"วูด ยู ไลก์ มอร์ อินฟอร์เมชัน อะเบาต์ ดิ เอ็กซ์โป",keys:[["like"],["more"],["information"],["expo"]]},
    {tts:"The Expo is known for diversity of life, wetland gardens, international gardens, greenhouses, and agricultural innovation.",read:"ดิ เอ็กซ์โป อิซ โนน ฟอร์ ไดเวอร์ซิตี ออฟ ไลฟ์, เว็ตแลนด์ การ์เดนส์, อินเทอร์แนชเชินนัล การ์เดนส์, กรีนเฮาส์ซิส, แอนด์ แอกริคัลเชอรัล อินโนเวชัน",keys:[["expo"],["known"],["diversity"],["life"],["wetland"],["international"],["greenhouse","greenhouses"],["agricultural"],["innovation"]]},
    {tts:"I apologize. Please give me a moment to check the information for you.",read:"ไอ อะพอลโลไจซฺ พลีซ กิฟ มี อะ โมเมนต์ ทู เช็ก ดิ อินฟอร์เมชัน ฟอร์ ยู",keys:[["apologize"],["please"],["moment"],["check"],["information"]]}
   ]
  ];
  const $=id=>document.getElementById(id);let ti=0,vi=0,si=0,score=0,passed=false,sentenceArranged=false,expected=[],selected=[],stream=null,practiceTimer=null;const scoredV=new Set(),scoredS=new Set();
  function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}
  function speakable(text){const fixes={Kut:'Koot',Dae:'Day',Mueang:'Muang'};return text.replace(/\b(Kut|Dae|Mueang)\b/g,w=>fixes[w]||w)}
  function say(text,rate=.7){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speakable(text));u.lang='en-US';u.rate=rate;u.pitch=1;window.speechSynthesis.speak(u)}
  function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
  function sim(a,b){a=norm(a);b=norm(b);if(a===b)return 1;const m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)m[i][0]=i;for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-m[a.length][b.length]/Math.max(a.length,b.length,1)}
  function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function img(n){return `images/${n}.webp`}function scores(){$('vScore').textContent=$('sScore').textContent=`${score} / 60`}
  function start(){ti=vi=si=score=0;scoredV.clear();scoredS.clear();loadV()}
  function loadV(){clearInterval(practiceTimer);practiceTimer=null;screen('vocab');passed=false;const t=topics[ti],v=t.v[vi];$('vTopic').textContent=t.title;$('vImg').src=img(v[3]);$('vImg').alt=v[2];$('vWord').textContent=v[0];$('vRead').textContent=`อ่านว่า ${v[1]}`;$('vMean').textContent=v[2];$('speechStatus').className='status';$('speechStatus').textContent='กด “ฟังคำศัพท์” แล้วกด “พูดตาม”';$('speak').disabled=false;$('nextWord').disabled=true;$('prevWord').disabled=ti===0&&vi===0;$('vProg').style.width=`${((ti*8+vi+1)/24)*100}%`;scores()}
  function soundEffect(notes=[523,659,784]){try{const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();notes.forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),at=ctx.currentTime+i*.13;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.001,at);g.gain.exponentialRampToValueAtTime(.18,at+.02);g.gain.exponentialRampToValueAtTime(.001,at+.18);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+.2)});setTimeout(()=>ctx.close(),900)}catch(e){}}
  async function detectSpokenSound(statusId,seconds=8,minSpeechMs=350,endSilenceMs=1000){const el=$(statusId);if(!navigator.mediaDevices?.getUserMedia){el.className='status bad';el.textContent='อุปกรณ์นี้ไม่รองรับไมโครโฟน';return false}let mic,ctx;try{speechSynthesis.cancel();mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();await ctx.resume();const source=ctx.createMediaStreamSource(mic),analyser=ctx.createAnalyser(),data=new Float32Array(1024);analyser.fftSize=1024;source.connect(analyser);const rms=()=>{analyser.getFloatTimeDomainData(data);let sum=0;for(const n of data)sum+=n*n;return Math.sqrt(sum/data.length)};el.className='status';el.textContent='เตรียมพร้อม... กรุณาอยู่เงียบสักครู่';let base=0,count=0;await new Promise(resolve=>{const start=performance.now();function calibrate(){base+=rms();count++;performance.now()-start<550?requestAnimationFrame(calibrate):resolve()}calibrate()});const threshold=Math.max(.018,(base/Math.max(count,1))*2.2);el.innerHTML=`🎤 เริ่มพูดได้เลย<br><small>ระบบจะรอจนพูดจบและเงียบ ${Math.round(endSilenceMs/100)/10} วินาที</small>`;return await new Promise(resolve=>{const start=performance.now();let voiced=0,silence=0,started=false,last=start;function listen(now){const delta=Math.min(80,now-last);last=now;if(rms()>threshold){started=true;voiced+=delta;silence=0}else if(started){silence+=delta}if(started&&voiced>=minSpeechMs&&silence>=endSilenceMs)return resolve(true);if(now-start>=seconds*1000)return resolve(started&&voiced>=minSpeechMs);requestAnimationFrame(listen)}requestAnimationFrame(listen)})}catch(e){el.className='status bad';el.textContent='เปิดไมโครโฟนไม่ได้ กรุณาอนุญาตการใช้ไมโครโฟน';return false}finally{mic?.getTracks().forEach(t=>t.stop());if(ctx&&ctx.state!=='closed')ctx.close()}}
  function pass(msg){if(passed)return;passed=true;const key=`${ti}-${vi}`;if(!scoredV.has(key)){scoredV.add(key);score++}soundEffect();$('speechStatus').className='status ok';$('speechStatus').textContent=`🎉 ${msg}`;$('nextWord').disabled=false;scores()}
  async function practiceWord(){if(passed)return;$('speak').disabled=true;const heard=await detectSpokenSound('speechStatus',8,300,1000);$('speak').disabled=false;heard?pass('พูดคำศัพท์จบแล้ว เยี่ยมมาก!'):Object.assign($('speechStatus'),{className:'status bad',textContent:'ยังไม่ได้ยินเสียงพูดชัด กรุณาเข้าใกล้ไมโครโฟนแล้วลองใหม่'})}
  function nextV(){if(!passed)return;if(++vi<5)loadV();else{vi=0;si=0;loadS()}}
  function prevV(){if(vi>0){vi--;loadV()}else if(ti>0){ti--;si=2;loadS()}}
  function loadS(){clearInterval(practiceTimer);practiceTimer=null;screen('sentence');sentenceArranged=false;const t=topics[ti],s=t.s[si],meta=sentenceSpeech[ti][si];expected=s[0].match(/\S+/g)||[];selected=[];$('sTopic').textContent=t.title;$('sImg').src=img(s[2]);$('sImg').alt=s[1];$('thai').textContent=`คำแปล: ${s[1]}`;$('sRead').textContent=`คำอ่าน: ${meta.read}`;$('nextSentence').disabled=true;$('listenSentence').disabled=true;$('speakSentence').disabled=true;$('speakSentence').textContent='🗣️ เริ่มพูดตาม';$('sentenceStatus').className='status';$('sentenceStatus').textContent='เรียงคำให้ถูกต้อง แล้วจึงฝึกพูดทั้งประโยค';$('sProg').style.width=`${((ti*8+6+si)/24)*100}%`;renderAnswer();renderTokens();scores()}
  function renderAnswer(){$('answer').innerHTML=selected.length?selected.map(w=>`<span>${esc(w)}</span>`).join(' '):'<span class="placeholder">แตะคำตามลำดับที่ถูกต้อง</span>'}
  function renderTokens(){$('tokens').innerHTML='';shuffle([...expected]).forEach((w,i)=>{const b=document.createElement('button');b.className='token';b.textContent=w;b.style.setProperty('--d',`${4.8+(i%4)*.45}s`);b.onclick=()=>choose(b,w);$('tokens').appendChild(b)})}
  function choose(b,w){say(w.replace(/[^a-z0-9]/gi,''),.67);const next=expected[selected.length];if(norm(w)===norm(next)){selected.push(w);b.classList.add('used');renderAnswer();$('sentenceStatus').className='status ok';$('sentenceStatus').textContent='ถูกต้อง เลือกคำถัดไป';if(selected.length===expected.length)completeS()}else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');$('sentenceStatus').className='status bad';$('sentenceStatus').textContent='ยังไม่ถูกต้อง กรุณาดูคำแปลแล้วลองใหม่'}}
  function completeS(){sentenceArranged=true;const full=topics[ti].s[si][0],meta=sentenceSpeech[ti][si];soundEffect([523,659,784,1047]);$('sentenceStatus').className='status ok';$('sentenceStatus').innerHTML=`🎉 เรียงประโยคถูกต้อง เยี่ยมมาก!<br><strong>${esc(full)}</strong><br>กดฟัง แล้วกด “เริ่มพูดตาม”`;$('listenSentence').disabled=false;$('speakSentence').disabled=false;setTimeout(()=>say(meta.tts,.7),650)}
  async function practiceFullSentence(){if(!sentenceArranged||practiceTimer)return;const startTopic=ti,startSentence=si,full=topics[ti].s[si][0],maxSeconds=Math.min(28,Math.max(14,Math.ceil(expected.length*.95+5))),minVoice=Math.min(4200,Math.max(900,expected.length*130));$('speakSentence').disabled=true;$('listenSentence').disabled=true;const heard=await detectSpokenSound('sentenceStatus',maxSeconds,minVoice,1800);if(ti!==startTopic||si!==startSentence)return;$('listenSentence').disabled=false;if(!heard){$('speakSentence').disabled=false;$('sentenceStatus').className='status bad';$('sentenceStatus').textContent='ยังไม่ได้ยินเสียงพูดจนจบ กรุณาเข้าใกล้ไมโครโฟนแล้วลองใหม่';return}const key=`${ti}-${si}`;if(!scoredS.has(key)){scoredS.add(key);score+=5}scores();soundEffect([523,659,784,1047]);$('sentenceStatus').className='status ok';$('sentenceStatus').innerHTML=`🎉 พูดประโยคจบแล้ว ฝึกสำเร็จและได้รับ 5 คะแนน<br><strong>${esc(full)}</strong>`;$('speakSentence').textContent='✓ ฝึกพูดแล้ว';$('nextSentence').disabled=false}
  function prevS(){if(si>0){si--;loadS()}else{vi=4;loadV()}}
  function nextS(){if(++si<3)loadS();else{ti++;si=0;ti<3?loadV():finish()}}function finish(){screen('complete');$('finalScore').textContent=`${score} / 60`;$('finalText').textContent=score>=54?'ระดับดีเยี่ยม พร้อมสื่อสารอย่างมั่นใจ!':score>=45?'ระดับดีมาก ฝึกซ้ำเพื่อเพิ่มความคล่องแคล่ว':'พยายามได้ดี ลองเล่นอีกครั้งเพื่อทบทวน'}function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
  async function ar(){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$('camera').srcObject=null;$('camera').style.display=$('shade').style.display='none';$('ar').textContent='📷 เปิดกล้องหน้า';return}
    if(!navigator.mediaDevices?.getUserMedia){alert('เบราว์เซอร์นี้ไม่รองรับกล้อง เกมยังเล่นในโหมดปกติได้');return}
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'}},audio:false});$('camera').srcObject=stream;$('camera').style.display=$('shade').style.display='block';$('ar').textContent='✕ ปิดกล้อง'}catch(e){alert('ไม่สามารถเปิดกล้องหน้าได้ กรุณาตรวจสอบสิทธิ์กล้อง')}
  }
  $('start').onclick=start;$('listen').onclick=()=>{say(topics[ti].v[vi][0],.67);$('speechStatus').textContent='ฟังให้ชัด แล้วกด “พูดตาม”'};$('speak').onclick=practiceWord;$('nextWord').onclick=nextV;$('prevWord').onclick=prevV;$('nextSentence').onclick=nextS;$('prevSentence').onclick=prevS;$('listenSentence').onclick=()=>say(sentenceSpeech[ti][si].tts,.67);$('speakSentence').onclick=practiceFullSentence;$('hint').onclick=()=>{$('sentenceStatus').className='status';$('sentenceStatus').textContent=`คำใบ้: ${expected.map((w,i)=>i<selected.length+2?w:'_____').join(' ')}`};$('reset').onclick=loadS;$('again').onclick=start;$('ar').onclick=ar;
  </script>
</body>
</html>
